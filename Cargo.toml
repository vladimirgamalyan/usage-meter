[package]
name = "usage-meter"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
native-tls = "0.2.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_HiDpi"] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
